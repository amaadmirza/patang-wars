# Builds the Patang Wars phone apps on GitHub's own machines - no Android Studio or Mac needed on your side.
#   Android: an APK (install it straight on a phone) and an AAB (for the Google Play Store)
#   iPhone:  an IPA (unsigned - see app/README-APP.md for how to install it or sign it for TestFlight / App Store)
# Run it: GitHub -> your repository -> Actions -> "Build Android & iPhone apps" -> Run workflow.
# When it finishes, download the files under "Artifacts" at the bottom of the run.
name: Build Android & iPhone apps

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['client/**', 'app/**', 'build.js', '.github/workflows/build-apps.yml']

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # to publish the finished apps as a GitHub Release

env:
  APP_BUILD: ${{ github.run_number }}   # goes up by one every run: Android/iPhone need a higher number for every update

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-24.04   # has the Android SDK installed (ubuntu-latest is moving to 26)
    timeout-minutes: 40
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK (already on the machine)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          [ -x "$SM" ] || { echo "::error::No sdkmanager under $SDK"; ls "$SDK" | sed 's/^/::error::/' ; exit 1; }
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /tmp/sdk.log 2>&1 || { tail -20 /tmp/sdk.log | sed 's/^/::error::/'; exit 1; }
          echo "SDK: $SDK"
      - name: Game files (offline app build)
        run: |
          npm install --no-audit --no-fund
          cd app && npm install --no-audit --no-fund && npm run www
      - name: Android project
        working-directory: app
        run: |
          set -o pipefail
          npx cap add android 2>&1 | tee /tmp/step.log || { tail -25 /tmp/step.log | sed 's/^/::error::/'; exit 1; }
          npx capacitor-assets generate --android --iconBackgroundColor '#1e2350' --iconBackgroundColorDark '#1e2350' --splashBackgroundColor '#1e2350' --splashBackgroundColorDark '#1e2350'
          node scripts/patch-native.js android
          npx cap sync android
      - name: Signing key
        id: key
        run: |
          mkdir -p signing
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > signing/release.jks
            echo "pass=$KS_PASS" >> "$GITHUB_OUTPUT"; echo "new=0" >> "$GITHUB_OUTPUT"
            echo "Using your saved signing key."
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore signing/release.jks -alias patangwars -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Patang Wars, O=Patang Wars, C=PK"
            echo "::add-mask::$PASS"
            echo "pass=$PASS" >> "$GITHUB_OUTPUT"; echo "new=1" >> "$GITHUB_OUTPUT"
            base64 -w0 signing/release.jks > signing/ANDROID_KEYSTORE_BASE64.txt
            printf '%s' "$PASS" > signing/ANDROID_KEYSTORE_PASSWORD.txt
            printf 'This run made a NEW signing key. Keep these two files private and add them as repository secrets\n(Settings -> Secrets and variables -> Actions -> New repository secret), named exactly like the files:\n  ANDROID_KEYSTORE_BASE64\n  ANDROID_KEYSTORE_PASSWORD\nThen every later build is signed with the same key, so phones can update the app (and Google Play accepts updates).\n' > signing/README.txt
            echo "::warning::No saved signing key: made a new one. Download the 'android-signing-key' artifact and add it as secrets (see its README) before you share builds."
          fi
      - name: Build APK and AAB
        working-directory: app/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/signing/release.jks" \
            -Pandroid.injected.signing.store.password="${{ steps.key.outputs.pass }}" \
            -Pandroid.injected.signing.key.alias=patangwars \
            -Pandroid.injected.signing.key.password="${{ steps.key.outputs.pass }}" 2>&1 | tee /tmp/gradle.log \
            || { grep -E "error:|What went wrong|FAILURE|Exception|> " /tmp/gradle.log | head -30 | sed 's/^/::error::/'; exit 1; }
      - name: Collect
        run: |
          V=$(node -p "require('./app/package.json').version")
          mkdir -p out
          cp app/android/app/build/outputs/apk/release/app-release.apk "out/PatangWars-$V-build$APP_BUILD.apk"
          cp app/android/app/build/outputs/bundle/release/app-release.aab "out/PatangWars-$V-build$APP_BUILD.aab"
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: android-app, path: out/, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.new == '1'
        with: { name: android-signing-key, path: signing/, retention-days: 7 }

  ios:
    name: iPhone (IPA)
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Game files (offline app build)
        run: |
          npm install --no-audit --no-fund
          cd app && npm install --no-audit --no-fund && npm run www
      - name: iPhone project
        working-directory: app
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#1e2350' --iconBackgroundColorDark '#1e2350' --splashBackgroundColor '#1e2350' --splashBackgroundColorDark '#1e2350'
          node scripts/patch-native.js ios
          npx cap sync ios
      - name: Build (unsigned)
        working-directory: app/ios/App
        run: |
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          set -o pipefail
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee /tmp/xc.log | grep -E "error:|warning: .*deprecated|BUILD" | tail -40 \
            || true
          grep -q "BUILD SUCCEEDED" /tmp/xc.log || { grep -E "error:" /tmp/xc.log | head -30 | sed 's/^/::error::/'; tail -15 /tmp/xc.log | sed 's/^/::error::/'; exit 1; }
      - name: Package IPA
        run: |
          V=$(node -p "require('./app/package.json').version")
          mkdir -p out Payload
          cp -R app/ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "out/PatangWars-$V-build$APP_BUILD-unsigned.ipa" Payload
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: iphone-app, path: out/, if-no-files-found: error }

  publish:
    name: Publish (GitHub Release)
    needs: [android, ios]
    if: always() && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { path: dl, pattern: '*-app', merge-multiple: true }
      - name: GitHub Release (download page for phones)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V=$(node -p "require('./app/package.json').version")
          TAG="v$V-build$APP_BUILD"
          ls -la dl
          printf 'Patang Wars %s (build %s)\n\n- **Android:** download the .apk on the phone and open it (allow "install unknown apps").\n- **Google Play:** upload the .aab.\n- **iPhone:** the .ipa is unsigned - install with Sideloadly/AltStore, or sign it for TestFlight (see app/README-APP.md).\n' "$V" "$APP_BUILD" > notes.md
          gh release create "$TAG" dl/* --title "Patang Wars $V (build $APP_BUILD)" --notes-file notes.md --latest
