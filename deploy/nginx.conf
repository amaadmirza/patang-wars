# Optional: HTTPS in front of the game with nginx (use this for a public domain).
#   1. run the game with HOST=127.0.0.1 TRUST_PROXY=1 so it is only reachable through nginx
#   2. put this in /etc/nginx/sites-available/kite-fight, link it into sites-enabled, then:
#      sudo certbot --nginx -d game.example.com
server {
  listen 80;
  server_name game.example.com;
  client_max_body_size 16k;
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;        # WebSocket (multiplayer)
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
  }
}
